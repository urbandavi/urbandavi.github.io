<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="tablak" id="tabla1">
        <div id="main-form">
            <p>Név</p><br>
            <input type="text" id="form-name"><br>
            <p>Osztály</p><br>
            <input id="form-class" type="text"><br>
            <p>Tanulmányi átlag</p><br>
            <input id="form-avr" type="number"><br>
            <p id="errorP"></p>
            <br>
            <button id="inputBtn" >Bevitel</button>
        </div>

        <h1>Statisztikák</h1><br>
        <button onclick="clickStatisticsChange()">Frissít</button><br>
        <p>Összes tanulók száma:</p>
        <p id="stTanulokSzama"></p> <br>


        <p>Osztályátlag:</p>
        <input type="text" id="stOsztalyInput" value="10.a"><br>
        <p id="stOsztalyAtlag"></p><br>





        <p>Legjobb tanuló:</p>
        <p id="stLegjobbTanulo"></p><br>
        <h3>Jegystatisztika</h3>
        <p>Jeles:</p>
        <p id="stJeles"></p><br>
        <p>Jó:</p>
        <p id="stJo"></p><br>
        <p>Közepes:</p>
        <p id="stKozepes"></p><br>
        <p>Elégséges:</p>
        <p id="stElegseges"></p><br>
        <p>Elégtelen:</p>
        <p id="stElegtelen"></p>
    </div>











    <!--Bal és Jobb oldal/------------------------------------------------------------------------------/-->



    <div class="tablak" id="tabla2">
        <input type="text" id="searchBar">
        <button id="kitunoKapcsoloGomb" onclick="ktKapcsolo()">
    Kitünő diákok
</button>
        <template id="diakok-template">
            <tr class="template-rows">
                <td id="nev"></td>
                <td id="osztaly"></td>
                <td id="atlag"></td>
                <td id="action-buttons">
                    <button class="modify">Módosítás</button>
                    <button class="delet">Törlés</button>
                </td>
            </tr>
        </template>


        <table id="table-body">
            <tr>
                <td>Név</td>
                <td>Osztály</td>
                <td>Átlag</td>
                <td>Műveletek</td>
            </tr>
        </table>
    </div>


    <script src="diakadat.js"></script>
</body>

</html>
